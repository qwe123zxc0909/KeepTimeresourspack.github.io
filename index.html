<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepTime x KSEPSP ResourcePack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0b1020 0%, #101a33 40%, #0b1020 100%);
            color: #eef2ff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
        }
        body::before { top: -50px; left: -50px; }
        body::after { bottom: -50px; right: -50px; }

        nav {
            width: 100%;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: #93c5fd;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.2);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none; }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 400px;
            width: 100%;
            height: auto;
            border-radius: 15px;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));
        }

        .description {
            font-size: 1.2rem;
            color: #a5b4fc;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .post-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin: 0 auto 30px auto;
            max-width: 550px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.5);
        }

        .post-author {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        .post-time {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .post-attachment {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attach-info {
            display: flex;
            flex-direction: column;
        }

        .attach-name {
            font-weight: bold;
            color: #93c5fd;
            font-size: 1.1rem;
            word-break: break-all;
        }

        .attach-size {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
        }

        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4);
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 25px;
            padding: 40px;
            margin-top: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .glass-card h2 {
            color: #93c5fd;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .link-item {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
            color: #e2e8f0;
            text-decoration: none;
            display: block;
        }

        .link-item:hover {
            border-color: #3b82f6;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .link-item span {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid rgba(96, 165, 250, 0.2);
            background: rgba(13, 17, 23, 0.5);
            backdrop-filter: blur(5px);
        }

        footer strong {
            color: #93c5fd;
        }
    </style>
</head>
<body>

    <nav>
        <a onclick="showPage('home')" class="active" id="nav-home">Главная</a>
        <a onclick="showPage('links')" id="nav-links">Ссылки</a>
    </nav>

    <!-- ГЛАВНАЯ СТРАНИЦА -->
    <div id="home" class="container">
        
        <div class="logo-container">
            <img src="logo.png" alt="KeepTime TexturePack Logo" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='block';">
            <h1 id="fallbackLogo" style="display: none; font-size: 3rem; background: linear-gradient(90deg, #60a5fa, #93c5fd, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KeepTime</h1>
        </div>

        <p class="description">
            Ресурспак, объединяющий <strong style="color: #ffffff;">KeepTime</strong> и <strong style="color: #ffffff;">KSEPSP</strong>
        </p>

        <div class="post-card">
            <div class="post-header">
                <div class="post-avatar">📦</div>
                <div>
                    <div class="post-author">KeepTime TexturePack</div>
                    <div class="post-time">Версия: 1.4.0</div>
                </div>
            </div>

            <div class="post-attachment">
                <div class="attach-info">
                    <span class="attach-name">§b§lKeep§f§lTime§f1.4.0.zip</span>
                    <span class="attach-size">ZIP Архив</span>
                </div>
                <button class="btn-download" onclick="downloadPack()">Скачать</button>
            </div>

            <p id="status"></p>
        </div>

    </div>

    <!-- СТРАНИЦА СО ССЫЛКАМИ -->
    <div id="links" class="container hidden">
        <div class="glass-card" style="text-align: center;">
            <h2>Наши проекты</h2>
            <p style="color: #94a3b8; margin-bottom: 30px;">Присоединяйся к нам!</p>
            
            <div class="links-grid">
                <a href="https://definitelyawhale.github.io/ksepsp_website/" target="_blank" class="link-item">
                    <span>🌐</span>
                    <span>KSEPSP Website</span>
                </a>
                <a href="https://qwe123zxc0909.github.io/staffstudio.github.io/" target="_blank" class="link-item">
                    <span>🎨</span>
                    <span>StaffStudio</span>
                </a>
                <a href="https://discord.gg/uWMwD56Xbc" target="_blank" class="link-item">
                    <span>💬</span>
                    <span>Discord Сервер</span>
                </a>
            </div>
        </div>
    </div>

    <footer>
        Разработано <strong>~STAFF_STUDIO~</strong> не официально
    </footer>

    <script>
        // Переключение страниц
        function showPage(pageId) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('links').classList.add('hidden');
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-links').classList.remove('active');

            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById('nav-' + pageId).classList.add('active');
        }

        // Скачивание ресурспака с "умным" поиском файла
        function downloadPack() {
            const originalFileName = "§b§lKeep§f§lTime§f1.4.0.zip";
            
            // GitHub ОЧЕНЬ плохо обрабатывает символы §. 
            // Пытаемся скачать по прямому пути с кодировкой.
            const encodedUrl = "resourpack/" + encodeURIComponent(originalFileName);
            
            // Запасной вариант (если ты переименуешь файл вручную)
            const fallbackUrl = "resourpack/KeepTime1.4.0.zip"; 
            
            const status = document.getElementById('status');
            status.textContent = "⏳ Ищем файл...";
            status.style.color = "#fbbf24";

            // Создаем ссылку для скачивания
            const a = document.createElement('a');
            
            // Метод 1: Пробуем скачать экранированную версию
            a.href = encodedUrl;
            a.download = originalFileName; // Браузер сохранит с красивым именем
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Проверяем через 1.5 секунды, скачался ли файл. Если нет — пробуем запасной путь
            setTimeout(() => {
                // Если браузер не начал загрузку (не появился файл в загрузках), 
                // мы не можем это отследить напрямую через JS, но GitHub часто 
                // редиректит на 404 страницу.
                // Вместо сложных проверок, обновим статус.
                
                status.textContent = "✅ Если загрузка не началась, переименуй архив в 'KeepTime1.4.0.zip' и положи в папку resourpack!";
                status.style.color = "#4ade80";
                
                // Альтернативная попытка (метод 2): если символы § не работают,
                // используем простую ссылку. Открываем её в новой вкладке, чтобы точно скачать.
                // window.open(fallbackUrl, '_blank'); // Раскомментируй, если стандартный клик не помог
            }, 2000);
        }
    </script>

</body>
</html>
